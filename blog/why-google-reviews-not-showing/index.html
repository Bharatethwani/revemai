                } else if (block.type === 'list') {
                    let listItems = block.items.map(item => `<li>${item}</li>`).join('');
                    contentHTML += `<ul>${listItems}</ul>`;
                }
            });

            if (data.cta) {
                contentHTML += `
                    <div class="inline-widget">
                        <h3>${data.cta.title}</h3>
                        <p>${data.cta.description}</p>
                        <a href="${data.cta.buttonUrl}" target="_blank" class="btn-primary">${data.cta.buttonText}</a>
                    </div>
                `;
                document.getElementById('dock-cta').href = data.cta.buttonUrl;
                document.getElementById('dock-cta').innerText = data.cta.buttonText;
            }

            contentDiv.innerHTML = contentHTML;

            const tagsDiv = document.getElementById('article-tags');
            if (data.tags && data.tags.length > 0) {
                tagsDiv.innerHTML = data.tags.map(tag => `<span class="tag">#${tag}</span>`).join('');
            }
        }

        // Run instantly
        buildPage(articleData);
    </script>
</body>
</html>
