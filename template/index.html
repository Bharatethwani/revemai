<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Loading...</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;900&display=swap" rel="stylesheet">

<style>
:root{
--primary:#2563eb;
--accent:#7c3aed;
--dark:#0f172a;
--bg:#ffffff;
--shadow-sm:0 4px 12px rgba(0,0,0,0.06);
--shadow-md:0 10px 30px rgba(0,0,0,0.10);
--shadow-lg:0 25px 60px rgba(0,0,0,0.12);
}

body{
font-family:'Inter',sans-serif;
background:var(--bg);
color:var(--dark);
}

/* Navbar */
.navbar{
background:rgba(255,255,255,0.9);
backdrop-filter:blur(15px);
box-shadow:var(--shadow-sm);
}

.navbar-brand{
font-weight:800;
font-size:1.4rem;
background:linear-gradient(135deg,var(--primary),var(--accent));
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* Hero */
.hero{
min-height:90vh;
background:linear-gradient(135deg,var(--primary),var(--accent));
display:flex;
align-items:center;
text-align:center;
color:white;
padding-top:80px;
}

.hero h1{
font-size:clamp(2rem,6vw,4rem);
font-weight:900;
}

.btn-premium{
background:white;
color:var(--primary);
font-weight:700;
padding:0.8rem 1.6rem;
border-radius:40px;
border:none;
}

/* Sections */
.section{
padding:60px 15px;
}

.section-title{
font-size:clamp(1.8rem,4vw,2.5rem);
font-weight:900;
text-align:center;
margin-bottom:40px;
}

/* Cards */
.service-card{
background:white;
border-radius:20px;
padding:25px;
box-shadow:var(--shadow-sm);
transition:.3s;
height:100%;
text-align:center;
}

.service-card:hover{
transform:translateY(-8px);
box-shadow:var(--shadow-lg);
}

.service-icon{
width:55px;
height:55px;
background:linear-gradient(135deg,var(--primary),var(--accent));
border-radius:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
color:white;
margin:0 auto 15px;
}

/* Contact */
.contact-card{
background:white;
border-radius:20px;
padding:25px;
box-shadow:var(--shadow-md);
}

.contact-item{
display:flex;
gap:12px;
margin-bottom:15px;
}

.contact-icon{
width:40px;
height:40px;
background:linear-gradient(135deg,var(--primary),var(--accent));
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
color:white;
}

.map-container{
height:300px;
border-radius:20px;
overflow:hidden;
box-shadow:var(--shadow-lg);
}

/* Footer */
.footer{
background:var(--dark);
color:#cbd5e1;
padding:40px 0;
text-align:center;
}

.footer h3{
color:white;
}

/* Loader */
#loader{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:white;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
font-size:20px;
}
</style>

</head>

<body>

<div id="loader">🔄 Loading Website...</div>

<!-- Navbar -->
<nav class="navbar fixed-top">
<div class="container">
<a class="navbar-brand" id="brandName"></a>
</div>
</nav>

<!-- Hero -->
<section class="hero">
<div class="container">
<h1 id="heroTitle"></h1>
<p class="lead" id="heroSubtitle"></p>
</div>
</section>

<!-- About -->
<section class="section text-center">
<h2 class="section-title">About</h2>
<p id="aboutText" class="text-muted fs-5"></p>
</section>

<!-- Services -->
<section class="section bg-light">
<div class="container">
<h2 class="section-title">Our Services</h2>
<div class="row g-4" id="servicesContainer"></div>
</div>
</section>

<!-- Contact -->
<section class="section" id="contact">
<div class="container">
<h2 class="section-title">Contact</h2>

<div class="row g-4">

<div class="col-lg-5">
<div class="contact-card">
<div class="contact-item"><div class="contact-icon"><i class="bi bi-telephone-fill"></i></div><div id="phone"></div></div>
<div class="contact-item"><div class="contact-icon"><i class="bi bi-envelope-fill"></i></div><div id="email"></div></div>
<div class="contact-item"><div class="contact-icon"><i class="bi bi-geo-alt-fill"></i></div><div id="address"></div></div>
</div>
</div>

<div class="col-lg-7">
<div class="map-container">
<iframe id="mapFrame" width="100%" height="100%" style="border:0"></iframe>
</div>
</div>

</div>
</div>
</section>

<!-- Footer -->
<footer class="footer">
<div class="container">
<h3 id="footerName"></h3>
<p id="footerTag"></p>
<hr>
<p id="copyright"></p>
</div>
</footer>

<script>

/* THEMES */
const themes = {
digital:{primary:"#2563eb",accent:"#7c3aed"},
restaurant:{primary:"#dc2626",accent:"#f59e0b"},
spa:{primary:"#059669",accent:"#34d399"},
salon:{primary:"#db2777",accent:"#f472b6"},
gym:{primary:"#111827",accent:"#ef4444"}
};

/* GET SUBDOMAIN */
function getSubdomain(){
const host = window.location.hostname;
if(host.includes("localhost")) return "lokeshartist";
return host.split('.')[0];
}

/* APPLY DATA */
function applySite(data){

document.title = data.title || "Website";

const theme = themes[data.theme] || themes.digital;
document.documentElement.style.setProperty('--primary', theme.primary);
document.documentElement.style.setProperty('--accent', theme.accent);

document.getElementById("brandName").textContent = data.brand || "";
document.getElementById("heroTitle").innerHTML = data.hero?.title || "";
document.getElementById("heroSubtitle").textContent = data.hero?.subtitle || "";
document.getElementById("aboutText").textContent = data.about || "";

document.getElementById("phone").textContent = data.contact?.phone || "";
document.getElementById("email").textContent = data.contact?.email || "";
document.getElementById("address").textContent = data.contact?.address || "";
document.getElementById("mapFrame").src = data.contact?.map || "";

document.getElementById("footerName").textContent = data.footer?.name || "";
document.getElementById("footerTag").textContent = data.footer?.tag || "";
document.getElementById("copyright").textContent = data.footer?.copyright || "";

const container = document.getElementById("servicesContainer");
container.innerHTML = "";

(data.services || []).forEach(s=>{
container.innerHTML += `
<div class="col-12 col-sm-6 col-lg-3">
<div class="service-card">
<div class="service-icon"><i class="bi ${s.icon || 'bi-star-fill'}"></i></div>
<h5>${s.title || ''}</h5>
<p>${s.desc || ''}</p>
</div>
</div>`;
});

}

/* LOAD FROM API */
async function loadSite(){
try{

const subdomain = getSubdomain();
// const subdomain = "lokeshartist";

console.log("Subdomain:", subdomain);

const res = await fetch(`https://iwhxyqczdfapprigyrpr.supabase.co/functions/v1/web-template?subdomain=${subdomain}`);

if(!res.ok) throw new Error("API Error");

const data = await res.json();
console.log("DATA:", data);

applySite(data);

document.getElementById("loader").style.display = "none";

}catch(err){
console.error(err);
document.getElementById("loader").innerHTML = "⚠️ Failed to load website";
}
}

/* INIT */
window.onload = loadSite;

</script>

</body>
</html>
