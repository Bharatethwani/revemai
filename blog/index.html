<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>RevmeAI Blog | Latest Articles</title>
    <meta name="description" content="Read the latest insights, guides, and updates on local SEO, Google Reviews, and AI from RevmeAI.">
    
    <style>
        /* Base / Dark Theme Variables */
        :root, [data-theme="dark"] {
            --bg-base: #050505;
            --text-main: #ededed;
            --text-muted: #a1a1aa;
            --accent-glow: #6366f1; /* Indigo glow */
            --accent-secondary: #ec4899; /* Pink glow */
            --dock-bg: rgba(20, 20, 20, 0.6);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --card-bg: rgba(255, 255, 255, 0.02);
            --card-hover-bg: rgba(255, 255, 255, 0.04);
            --hover-bg: rgba(255, 255, 255, 0.1);
            
            --font-display: 'Newsreader', 'Georgia', serif;
            --font-body: 'Inter', system-ui, -apple-system, sans-serif;
        }

        /* Light Theme Override */
        [data-theme="light"] {
            --bg-base: #f9fafb;
            --text-main: #111827;
            --text-muted: #4b5563;
            --dock-bg: rgba(255, 255, 255, 0.7);
            --border-subtle: rgba(0, 0, 0, 0.1);
            --card-bg: #ffffff;
            --card-hover-bg: #f3f4f6;
            --hover-bg: rgba(0, 0, 0, 0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: var(--font-body);
            line-height: 1.6;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        /* Ambient Mesh Gradient Background */
        .ambient-glow {
            position: fixed;
            top: -20%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--accent-glow) 0%, transparent 60%);
            opacity: 0.15;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
            animation: pulse 10s ease-in-out infinite alternate;
        }

        .ambient-glow.two {
            top: 40%;
            left: 60%;
            background: radial-gradient(circle, var(--accent-secondary) 0%, transparent 60%);
            animation-delay: -5s;
        }

        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.1; }
            100% { transform: scale(1.2); opacity: 0.2; }
        }

        /* Header */
        header.site-header {
            padding: 2rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-subtle);
            position: relative;
            z-index: 10;
        }

        .brand {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.05em;
            color: var(--text-main);
            text-decoration: none;
        }

        /* Theme Toggle */
        .theme-toggle {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .theme-toggle:hover {
            background: var(--hover-bg);
            transform: scale(1.05);
        }
        .theme-toggle svg { width: 20px; height: 20px; fill: currentColor; }
        [data-theme="light"] .icon-sun { display: none; }
        [data-theme="dark"] .icon-moon { display: none; }

        /* Main Container */
        .blog-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 5rem 1.5rem 10rem 1.5rem;
            position: relative;
            z-index: 10;
        }

        .blog-header {
            text-align: center;
            margin-bottom: 5rem;
        }

        .blog-header h1 {
            font-family: var(--font-display);
            font-size: clamp(3rem, 6vw, 4.5rem);
            font-weight: 400;
            letter-spacing: -0.02em;
            margin-bottom: 1rem;
        }

        .blog-header p {
            font-size: 1.25rem;
            color: var(--text-muted);
            max-width: 600px;
            margin: 0 auto;
        }

        /* Article Grid */
        .article-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2.5rem;
        }

        /* Article Card */
        .article-card {
            background: var(--card-bg);
            border: 1px solid var(--border-subtle);
            border-radius: 20px;
            overflow: hidden;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            text-decoration: none;
            color: inherit;
        }

        .article-card:hover {
            transform: translateY(-5px);
            background: var(--card-hover-bg);
            border-color: var(--accent-glow);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .card-image-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
            border-bottom: 1px solid var(--border-subtle);
        }

        .card-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .article-card:hover .card-image {
            transform: scale(1.05);
        }

        .card-content {
            padding: 2rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-category {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--accent-glow);
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .card-title {
            font-family: var(--font-display);
            font-size: 1.6rem;
            font-weight: 400;
            line-height: 1.3;
            margin-bottom: 1rem;
            color: var(--text-main);
        }

        .card-description {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 2rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            border-top: 1px solid var(--border-subtle);
            padding-top: 1.2rem;
        }

        /* Spatial UI Floating Dock */
        .spatial-dock {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            background: var(--dock-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-subtle);
            padding: 0.5rem;
            border-radius: 100px;
            display: flex;
            gap: 0.5rem;
            z-index: 100;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }

        .dock-item {
            background: transparent;
            border: none;
            color: var(--text-main);
            padding: 0.8rem 1.5rem;
            border-radius: 100px;
            cursor: pointer;
            font-weight: 500;
            font-family: inherit;
            transition: background 0.3s ease;
            text-decoration: none;
        }

        .dock-item:hover {
            background: var(--hover-bg);
        }

        .dock-item.highlight {
            background: var(--text-main);
            color: var(--bg-base);
        }
    </style>
</head>

    <!-- ============================================== -->
    <!-- LOGIC: JSON DATA, RENDERING & THEME TOGGLE -->

    <script>
        // --- THEME TOGGLE LOGIC ---
        const toggleBtn = document.getElementById('theme-toggle');
        
        const savedTheme = localStorage.getItem('revmeai-theme');
        if (savedTheme) {
            document.body.setAttribute('data-theme', savedTheme);
        } else {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
                document.body.setAttribute('data-theme', 'light');
            }
        }

        toggleBtn.addEventListener('click', () => {
            const currentTheme = document.body.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.body.setAttribute('data-theme', newTheme);
            localStorage.setItem('revmeai-theme', newTheme);
        });

        // --- JSON DATA (List of Articles) ---
        const blogPosts = [
            {
                
                "url": "/blog/how-to-generate-5-star-google-reviews",
                "category": "Google Reviews",

            },
            {
                "url": "/blog/how-to-ask-customers-for-google-reviews/",

                "publishDate": "2026-07-21",
                "readTime": "8 min read",
                "featuredImage": "https://images.unsplash.com/photo-1485827404703-89b55fcc595e?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
            },
            {
                "url": "/blog/will-google-remove-ai-generated-reviews-in-2026/",
                "category": "Local SEO",
                "title": "Will Google Remove AI-Generated Reviews in 2026? (Truth Explained)",
                "description": "Wondering whether Google removes AI-generated reviews? Learn Google's latest review policy, ",
                "publishDate": "2026-07-15",

                "featuredImage": "https://images.unsplash.com/photo-1460925895917-afdab827c52f?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80"
            },
              
            {
                "url": "/blog/why-google-reviews-not-showing/",
                "category": "Google Reviews",
  "title": "Why Are My Google Reviews Not Showing? (10 Reasons + Fixes)",
  "description": "Wondering why your Google reviews are not showing? Learn the top 10 reasons reviews disappear or never appear, plus practical fixes to get your customer reviews visible again.",
                "publishDate": "2026-07-02",
                "readTime": "5 min read",
  "featuredImage": "https://images.unsplash.com/photo-1702468292651-fd16394e4ddd?q=80&w=987&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D",
            }
        ];

        // --- RENDERING ENGINE FOR HOMEPAGE ---
        function buildBlogGrid(articles) {
            const grid = document.getElementById('article-grid');
            let htmlContent = '';

            articles.forEach(article => {
                // Format the date
                const formattedDate = new Date(article.publishDate).toLocaleDateString('en-US', {
                    month: 'short', day: 'numeric', year: 'numeric'
                });

                htmlContent += `
                    <a href="${article.url}" class="article-card">
                        <div class="card-image-wrapper">
                            <img src="${article.featuredImage}" alt="${article.title}" class="card-image">
                        </div>
                        <div class="card-content">
                            <span class="card-category">${article.category}</span>
                            <h2 class="card-title">${article.title}</h2>
                            <p class="card-description">${article.description}</p>
                            
                            <div class="card-meta">
                                <span>${formattedDate}</span>
                                <span>${article.readTime}</span>
                            </div>
                        </div>
                    </a>
                `;
            });

            grid.innerHTML = htmlContent;
        }

        // Run instantly
        buildBlogGrid(blogPosts);
    </script>
